<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#351c32">
  <title>Anagha, a little coffee proposal ☕</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    :root { color-scheme: dark; --cream:#fff1db; --pink:#ffb8c7; --muted:#cbb7c4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:28px 18px; color:var(--cream); font-family:'DM Sans',sans-serif; background:radial-gradient(ellipse at 15% 15%,#68344a 0,transparent 50%),radial-gradient(ellipse at 90% 85%,#493756 0,transparent 50%),#241a28; }
    body::before { content:''; position:fixed; inset:16px; border:1px solid #ffffff16; border-radius:24px; pointer-events:none; }
    main { width:min(100%,560px); text-align:center; }
    .eyebrow { color:var(--pink); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:3px; }
    .card { position:relative; margin:24px 0 20px; padding:38px 32px; border:1px solid #ffffff26; border-radius:28px; background:linear-gradient(140deg,#ffffff0e,#ffffff03); box-shadow:0 28px 90px #100b193f; backdrop-filter:blur(16px); }
    .badge { display:inline-block; padding:7px 13px; border:1px solid #ffb8c744; border-radius:30px; color:var(--pink); font-size:11px; letter-spacing:1px; transform:rotate(-4deg); }
    .cup { font-size:64px; margin:24px 0 12px; filter:drop-shadow(0 8px 16px #ffb8c733); }
    h1 { font-family:'Playfair Display',Georgia,serif; font-size:clamp(36px,7vw,52px); line-height:1.12; font-weight:600; margin:0 0 15px; }
    h1 em { color:var(--pink); }
    .intro { color:var(--muted); font-size:14px; line-height:1.7; margin:0 auto 28px; max-width:340px; }
    .progress { display:flex; justify-content:center; gap:8px; margin-bottom:25px; }
    .progress[hidden] { display:none; }
    .dot { width:30px; height:4px; border-radius:9px; background:#ffffff20; transition:background .3s; }
    .dot.active { background:var(--pink); }
    .step-label { color:var(--pink); font-size:10px; letter-spacing:2px; text-transform:uppercase; }
    h2 { font-size:23px; line-height:1.4; font-weight:500; margin:12px 0 8px; }
    .aside { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 24px; }
    .answers { display:grid; gap:10px; }
    button { width:100%; padding:15px 18px; border-radius:13px; border:1px solid #ffffff29; background:#ffffff07; color:var(--cream); font:500 14px 'DM Sans',sans-serif; cursor:pointer; transition:transform .2s,background .2s,border-color .2s; }
    button:hover { transform:translateY(-2px); background:#ffffff12; border-color:var(--pink); }
    button.primary { background:var(--pink); color:#3c2230; border-color:var(--pink); }
    button.primary:hover { background:#ffd0d9; }
    button:focus-visible { outline:3px solid var(--cream); outline-offset:4px; }
    .footer { color:#cbb7c48f; font-size:11px; letter-spacing:.5px; }
    .receipt { margin:20px 0; border-top:1px dashed #ffffff30; border-bottom:1px dashed #ffffff30; padding:16px 0; color:var(--muted); font-size:14px; line-height:1.8; }
    .heart { position:fixed; top:-40px; pointer-events:none; animation:fall 3s ease-in forwards; font-size:22px; }
    @keyframes fall { to { transform:translateY(110vh) rotate(160deg); opacity:0; } }
    @media(max-width:420px) { .card { padding:30px 20px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A very important, very unserious invitation</div>
    <section class="card" aria-label="Coffee invitation for Anagha">
      <div class="badge">EXCLUSIVELY FOR ANAGHA</div>
      <div class="cup" aria-hidden="true">☕</div>
      <h1>Hey Anagha,<br>let’s <em>espresso</em><br>our feelings.</h1>
      <p class="intro">Three tiny questions. One suspiciously cute agenda. Absolutely no PowerPoint.</p>
      <div class="progress" aria-label="Question progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
      <div id="quiz" aria-live="polite" aria-atomic="true"></div>
    </section>
    <div class="footer">Made with courage, caffeine & questionable puns. ♡</div>
  </main>
  <script>
    const questions = [
      { title: 'Your ideal coffee sidekick?', note: 'Choose wisely. My ego is wearing a tiny helmet.', answers: ['You, obviously 😌', 'You… but bring cookies 🍪'] },
      { title: 'Pick our café personality.', note: 'Both come with complimentary awkward eye contact.', answers: ['Fancy sips, silly gossip ✨', 'Iced coffee, warm roasting 🧊'] },
      { title: 'So… coffee date with me?', note: 'One cup. Two cuties. Zero interview questions.', answers: ['Yes! It’s a brew-tiful idea 💕', 'Maybe later ☁️'] }
    ];
    const quiz = document.getElementById('quiz');
    let step = 0;
    function render() {
      document.querySelectorAll('.dot').forEach((dot, index) => dot.classList.toggle('active', index <= step));
      const q = questions[step];
      quiz.replaceChildren();
      const label = document.createElement('div');
      label.className = 'step-label';
      label.textContent = `Question 0${step + 1} / 03`;
      const heading = document.createElement('h2');
      heading.textContent = q.title;
      heading.tabIndex = -1;
      const note = document.createElement('p');
      note.className = 'aside';
      note.textContent = q.note;
      const answers = document.createElement('div');
      answers.className = 'answers';
      q.answers.forEach((answer, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = index === 0 ? 'primary' : '';
        button.textContent = answer;
        button.addEventListener('click', () => {
          if (step < 2) { step++; render(); }
          else finish(index === 0);
        });
        answers.append(button);
      });
      quiz.append(label, heading, note, answers);
      if (step > 0) heading.focus();
    }
    function finish(yes) {
      document.querySelector('.progress').hidden = true;
      quiz.innerHTML = yes
        ? '<h2 tabindex="-1">It’s a date, Anagha! 💖</h2><p class="aside">My cool, mysterious persona lasted exactly zero seconds.</p><div class="receipt">The plan: coffee + you + me<br>The dress code: your favourite smile<br>The when & where: let’s pick together</div><p class="aside">Send me a “☕” and we’ll make a plan.<br>This page keeps your answer to itself.</p>'
        : '<h2 tabindex="-1">No pressure, Anagha ☁️</h2><p class="aside">The coffee can wait.<br>My terrible puns, unfortunately, cannot.</p>';
      const restart = document.createElement('button');
      restart.type = 'button';
      restart.textContent = 'One more sip? Start over ↺';
      restart.addEventListener('click', () => { step = 0; document.querySelector('.progress').hidden = false; render(); quiz.querySelector('h2').focus(); });
      quiz.append(restart);
      quiz.querySelector('h2').focus();
      if (yes && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (let i = 0; i < 22; i++) {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.setAttribute('aria-hidden', 'true');
          heart.textContent = ['♡', '💕', '☕', '✨'][i % 4];
          heart.style.left = `${Math.random() * 96}%`;
          heart.style.animationDelay = `${Math.random()}s`;
          document.body.append(heart);
          setTimeout(() => heart.remove(), 4200);
        }
      }
    }
    render();
  </script>
</body>
</html>
